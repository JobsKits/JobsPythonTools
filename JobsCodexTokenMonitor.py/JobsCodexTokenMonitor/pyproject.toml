[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobs-codex-token-monitor"
version = "0.1.0"
description = "Jobs Codex Token 上下行独立监控"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
build = ["pyinstaller>=6.10,<7"]

[project.scripts]
jobs-codex-token-monitor = "jobs_codex_token_monitor.app:main"

[tool.setuptools.packages.find]
where = ["src"]
